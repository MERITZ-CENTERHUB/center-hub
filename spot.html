<style>
:root{--bg:#f4f4f2;--sf:#fff;--ink:#1b1b1b;--mu:#6a6a68;--ln:#dedcd8;--red:#c8281e;--grn:#1f7a4d;--grns:#e3f3ea;--warn:#a8720a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header.hd{background:#000;color:#fff;padding:14px 24px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.hd .sm{font-size:11px;color:#ffb3a8;font-style:italic}.hd h1{margin:0;font-size:24px;font-weight:800}.hd h1 b{color:#ff5a4a}
.hbtn{border:1px solid #bbb;background:transparent;color:#fff;border-radius:6px;padding:7px 14px;font-size:14px;text-decoration:none}
.hubnav{display:flex;gap:6px;padding:10px 24px 0;background:#fff;border-bottom:3px solid #c8281e;overflow-x:auto}
.hubnav a{border:1px solid #dedcd8;border-bottom:0;background:#f0efec;border-radius:8px 8px 0 0;padding:8px 18px;font-size:14px;color:#6a6a68;white-space:nowrap;font-weight:700;text-decoration:none;margin-bottom:-3px}
.hubnav a.on{background:#fff;color:#c8281e;border-color:#c8281e;border-bottom:3px solid #fff}
.draft{background:#fff4d6;color:#7a5a00;text-align:center;font-size:13px;padding:6px 10px;border-bottom:1px solid #ecd9a0}
.wrap{max-width:1500px;margin:0 auto;padding:16px 16px 60px;display:grid;gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.b{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.b.p{background:var(--red);border-color:var(--red);color:#fff}
input[type=text],select{border:1px solid var(--ln);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px;background:#fff}
.mu{color:var(--mu);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;border-top:3px solid #555}
.kpi .l{font-size:12px;color:var(--mu)}.kpi .v{font-size:22px;font-weight:800;margin-top:2px}.kpi .u{font-size:12px;color:var(--mu);font-weight:400}
.kpi.red{border-top-color:var(--red)}.kpi.red .v{color:var(--red)}.kpi.grn{border-top-color:var(--grn)}.kpi.grn .v{color:var(--grn)}
.pill{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.pill.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.sheet{background:#fff;padding:14px 16px;width:fit-content;max-width:100%;overflow-x:auto}
.title{font-size:20px;font-weight:800;margin:0 0 2px}.title i{display:inline-block;width:6px;height:20px;background:var(--red);vertical-align:-3px;margin-right:8px}
.date{color:var(--mu);font-size:13px;margin-bottom:8px}
table{border-collapse:collapse;font-size:14px;text-align:center}
th{background:#3a3a3a;color:#fff;padding:8px 10px;white-space:nowrap;border:1px solid #555;font-size:13px}
td{padding:6px 10px;border:1px solid var(--ln);white-space:nowrap}
td.l{text-align:left}td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
tr.sub td{background:#f1f0ed;font-weight:800;border-top:2px solid #777}
tr.tot td{background:#2b2b2b;color:#fff;font-weight:800}
.rate{display:flex;align-items:center;gap:6px;min-width:130px}
.rate .tr{flex:1;height:10px;background:#ece9e4;border-radius:6px;overflow:hidden}.rate .fg{height:100%;background:var(--red)}
.rate b{width:50px;text-align:right}
td.ok{background:var(--grns)}td.ok .fg{background:var(--grn)}
.short{color:var(--red);font-weight:700}
.chk{color:var(--grn);font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:8px;z-index:30;max-width:92vw}
.empty{padding:30px;text-align:center;color:var(--mu)}
@media(max-width:700px){header.hd{padding:12px 14px}.hd h1{font-size:19px}.hubnav{padding:8px 10px 0}.hubnav a{padding:7px 12px;font-size:13px}.wrap{padding:10px 8px 50px}.sheet{padding:10px 8px}table{font-size:13px}}
.sel{min-width:260px;font-weight:700}
</style>

<body>
<header class="hd"><div><div class="sm">30% 성장을 위하여!</div><h1><b>충청GA본부</b> 매니저 스팟시상</h1></div><a class="hbtn" href="index.html">← 센터장 업무허브</a></header>
<nav class="hubnav"><a href="index.html">🏠 홈</a><a href="coaching.html">📝 매니저코칭노트</a><a href="goal.html">🎯 매니저목표진척</a><a href="golden.html">🏅 본부골든룰</a><a href="spot.html" class="on">🎁 매니저스팟시상</a></nav>
<div class="wrap">
  <div class="card" id="notice" hidden style="color:#c00"></div>
  <div class="card bar">
    <select id="camp" class="sel" title="스팟시상 선택"></select>
    <button class="b" id="newC">＋ 새 시상</button>
    <button class="b" id="renC">✏️ 이름 변경</button>
    <button class="b" id="delC" style="color:var(--red)">🗑 삭제</button>
    <span class="sp"></span>
    <button class="b p" id="upP">📥 진척 올리기 (매핑지사실적 엑셀)</button>
    <button class="b" id="upT">🎯 목표 올리기 (스팟시상 타겟 엑셀)</button>
    <button class="b" data-img="save">🖼 이미지 저장</button><button class="b" data-img="copy">📋 이미지 복사</button>
    <input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden>
  </div>
  <div class="mu" id="meta"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card bar">
    <input type="text" id="q" placeholder="매니저 이름·코드 검색">
    <select id="view"><option value="branch">지점별 보기</option><option value="rate">달성율 높은 순</option><option value="short">부족금액 큰 순</option></select>

  </div>
  <div class="card" style="overflow-x:auto"><div class="sheet" id="sheet"><div class="empty">불러오는 중…</div></div></div>
  <div class="mu">달성율 = 진척 ÷ 목표 · 부족금액 = 목표 − 진척 (목표를 넘으면 0) · 진척은 매니저 코드 기준 매핑지사실적 금액입니다 · 시상이 새로 열리면 「＋ 새 시상」을 만들고 타겟 엑셀의 「26~27일 목표」 같은 목표 열을 올려 주세요. 진척은 로그인한 누구나 올릴 수 있습니다.</div>
</div>
<script>
const SUPA_URL="https://usxzzgkewedyxrkkzudc.supabase.co";
const SUPA_KEY="sb_publishable_t_h3yZy5I8_k6UK3qaLIeA_V9CU1-E2";
const NOCOACH=["고범석","민향기"];
const NAME_BY_EMAIL={"gjdmswo@center-hub.app":"허은재","ghddudal@center-hub.app":"홍영미","whthgus@center-hub.app":"조소현","rlaalthd@center-hub.app":"김미송","dlthdbs@center-hub.app":"이소윤","dldmswjd@center-hub.app":"이은정","rhqjatjr@center-hub.app":"고범석","alsgidrl@center-hub.app":"민향기","master@center-hub.app":"마스터"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>Math.round(n).toLocaleString("ko-KR");
const bnum=b=>parseInt((b||"").replace(/\D/g,""))||0;
const cl=s=>String(s??"").replace(/\s+/g,"").trim();
let sb,me="",camps=[],cid="",DATA=[],sel=new Set(),loaded=false;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
const rate=(t,p)=>t>0?p/t:0;
const sums=l=>{const t=l.reduce((s,r)=>s+r.t,0),p=l.reduce((s,r)=>s+r.p,0);return{t,p,r:rate(t,p),s:Math.max(t-p,0),ok:l.filter(r=>r.t>0&&r.p>=r.t).length,n:l.length}};
const rateCell=r=>`<td class="${r>=1?"ok":""}"><div class="rate"><div class="tr"><div class="fg" style="width:${Math.max(Math.min(r,1),0)*100}%"></div></div><b>${(r*100).toFixed(1)}%</b></div></td>`;
const cur=()=>camps.find(c=>c.id===cid);
const stamp=d=>d?new Date(d).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";

function render(){
  $("#camp").innerHTML=camps.length?camps.map(c=>`<option value="${esc(c.id)}" ${c.id===cid?"selected":""}>${esc(c.name)}</option>`).join(""):`<option value="">(만들어진 스팟시상이 없습니다)</option>`;
  const c=cur();
  $("#meta").textContent=c?`${c.perf_at?"진척 업데이트: "+stamp(c.perf_at)+(c.perf_by?" · "+c.perf_by:""):"진척이 아직 올라오지 않았습니다"}${c.created_by?" · 시상 만든 사람: "+c.created_by:""}`:"";
  if(!loaded)return;
  const brs=[...new Set(DATA.map(r=>r.b))].sort((a,b)=>bnum(a)-bnum(b));
  [...sel].forEach(b=>{if(!brs.includes(b))sel.delete(b)});
  $("#brs").innerHTML=brs.length?`<span class="mu">지점</span><button class="pill ${sel.size?"":"on"}" data-b="전체">전체</button>`+brs.map(b=>`<button class="pill ${sel.has(b)?"on":""}" data-b="${esc(b)}">${bnum(b)}지점</button>`).join(""):"";
  const kw=$("#q").value.trim(),view=$("#view").value;
  const vis=DATA.filter(r=>(!sel.size||sel.has(r.b))&&(!kw||r.n.includes(kw)||r.c.includes(kw)));
  const S=sums(vis);
  $("#kpis").innerHTML=c&&DATA.length?`<div class="kpi"><div class="l">목표 합계</div><div class="v">${f(S.t)}<span class="u"> 원</span></div></div>
   <div class="kpi"><div class="l">현재 진척</div><div class="v">${f(S.p)}<span class="u"> 원</span></div></div>
   <div class="kpi grn"><div class="l">달성율</div><div class="v">${(S.r*100).toFixed(1)}<span class="u"> %</span></div></div>
   <div class="kpi red"><div class="l">부족금액</div><div class="v">${f(S.s)}<span class="u"> 원</span></div></div>
   <div class="kpi"><div class="l">목표 달성 매니저</div><div class="v">${S.ok}<span class="u"> / ${S.n}명</span></div></div>`:"";
  if(!c){$("#sheet").innerHTML=`<div class="empty">스팟시상이 아직 없습니다.<br><b>＋ 새 시상</b>을 눌러 이름을 정한 뒤 <b>목표 올리기</b>로 타겟 엑셀을 올려 주세요.</div>`;return}
  if(!DATA.length){$("#sheet").innerHTML=`<div class="empty">「${esc(c.name)}」에 목표가 아직 없습니다.<br><b>🎯 목표 올리기</b>로 스팟시상 타겟 엑셀을 올려 주세요.</div>`;return}
  let h=`<div class="title"><i></i>${esc(c.name)}</div><div class="date">충청GA본부 · 목표 대비 현재 진척 (매핑지사실적 기준)${c.perf_at?" · "+stamp(c.perf_at)+" 기준":""}</div>
<table><thead><tr><th>지점명</th><th>지점장</th><th>매니저</th><th>직책</th><th>목표</th><th>진척</th><th>달성율</th><th>부족금액</th><th>달성</th></tr></thead><tbody>`;
  const row=r=>{const x=rate(r.t,r.p),ok=r.t>0&&r.p>=r.t;return `<tr><td class="l">${esc(r.b)}</td><td>${esc(r.h)}</td><td class="l"><b>${esc(r.n)}</b></td><td>${esc(r.g)}</td><td class="n">${f(r.t)}</td><td class="n">${f(r.p)}</td>${rateCell(x)}<td class="n ${ok?"":"short"}">${ok?"-":f(r.t-r.p)}</td><td class="${ok?"chk":""}">${ok?"✔":""}</td></tr>`};
  if(!vis.length)h+=`<tr><td colspan="9" class="empty">조건에 맞는 매니저가 없습니다.</td></tr>`;
  else if(view==="branch"){
    [...new Set(vis.map(r=>r.b))].sort((a,b)=>bnum(a)-bnum(b)).forEach(b=>{
      const l=vis.filter(r=>r.b===b).sort((a,c)=>a.n.localeCompare(c.n,"ko"));l.forEach(r=>h+=row(r));
      const s=sums(l);h+=`<tr class="sub"><td class="l" colspan="2">${bnum(b)}지점 합계</td><td>${s.n}명</td><td></td><td class="n">${f(s.t)}</td><td class="n">${f(s.p)}</td>${rateCell(s.r)}<td class="n short">${f(s.s)}</td><td>${s.ok}/${s.n}</td></tr>`});
  }else{
    const l=[...vis].sort(view==="rate"?(a,c)=>rate(c.t,c.p)-rate(a.t,a.p):(a,c)=>Math.max(c.t-c.p,0)-Math.max(a.t-a.p,0));l.forEach(r=>h+=row(r));
  }
  h+=`<tr class="tot"><td class="l" colspan="3">${sel.size||kw?"선택 합계":"본부 합계"}</td><td>${S.n}명</td><td class="n">${f(S.t)}</td><td class="n">${f(S.p)}</td><td>${(S.r*100).toFixed(1)}%</td><td class="n">${f(S.s)}</td><td>${S.ok}/${S.n}</td></tr></tbody></table>`;
  $("#sheet").innerHTML=h;
}

/* ---- 서버에서 불러오기 ---- */
async function loadCamps(){
  const {data,error}=await sb.from("spot_campaigns").select("*").order("created_at",{ascending:false}).limit(200);
  if(error)throw error;camps=data;
  if(!camps.find(c=>c.id===cid)){const s=localStorage.getItem("spot-cid");cid=camps.find(c=>c.id===s)?s:(camps[0]?camps[0].id:"")}
}
async function loadData(){
  DATA=[];
  if(!cid)return;
  const [a,b]=await Promise.all([sb.from("spot_targets").select("*").eq("campaign",cid).order("ord").range(0,2999),sb.from("spot_perf").select("code,perf").eq("campaign",cid).range(0,2999)]);
  if(a.error)throw a.error;if(b.error)throw b.error;
  const pm=new Map(b.data.map(r=>[r.code,Number(r.perf)||0]));
  DATA=a.data.map(r=>({b:r.branch,h:r.branch_head,c:r.code,n:r.manager,g:r.grade,t:Number(r.target)||0,p:pm.get(r.code)||0}));
}
async function init(){
  try{await loadCamps();await loadData();$("#notice").hidden=true}
  catch(e){$("#notice").hidden=false;$("#notice").textContent="서버에서 자료를 불러오지 못했습니다. 수퍼베이스에서 spot.sql 을 실행했는지 확인해 주세요.";DATA=[]}
  loaded=true;render();
}
$("#camp").onchange=async e=>{cid=e.target.value;localStorage.setItem("spot-cid",cid);sel.clear();await loadData().catch(()=>{DATA=[]});render()};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-b]");if(b){const v=b.dataset.b;if(v==="전체")sel.clear();else if(sel.has(v))sel.delete(v);else sel.add(v);render();return}
  const im=e.target.closest("[data-img]");if(im)exportImg(im.dataset.img);
});
$("#q").oninput=render;$("#view").onchange=render;

  const nm=(prompt("새 스팟시상 이름을 입력하세요.\n예: '26년 12월 1주차 스팟시상 (3~4일 목표)")||"").trim();if(!nm)return;

};

/* ---- 엑셀 읽기 (진척 / 목표) ---- */
let upKind="p";
$("#upP").onclick=()=>{if(!cur()){alert("먼저 시상을 선택하거나 만들어 주세요.");return}upKind="p";$("#xf").click()};
$("#upT").onclick=()=>{if(!cur()){alert("먼저 「＋ 새 시상」으로 시상을 만들어 주세요.");return}upKind="t";$("#xf").click()};
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(/,/g,""));return isNaN(n)?null:n};
function findTable(wb,kind){
  let best=null;
  for(const sn of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
    const hi=a.findIndex(r=>r.some(c=>{const x=cl(c);return x==="매니저코드"||x==="매니저사번"||x==="코드"||x==="사번"}));if(hi<0)continue;
    const r1=a[hi].map(cl),r2=(a[hi+1]||[]).map(cl);
    const H=r1.map((x,j)=>{const y=r2[j]||"";return/^\d+$/.test(y)?x:(x===y?x:x+y)});
    const ci=H.findIndex(x=>x==="매니저코드"||x==="매니저사번"||x==="코드"||x==="사번");
    let vi;
    if(kind==="p"){vi=H.findIndex(x=>x.includes("매핑")&&x.endsWith("실적")&&!x.includes("인원"));if(vi<0)vi=H.findIndex((x,j)=>j!==ci&&(x==="실적"||x==="실적합계"))}
    else{vi=H.findIndex(x=>x.includes("목표")&&x.includes("%"));if(vi<0)vi=H.findIndex(x=>x.includes("목표"))}
    if(vi<0)continue;
    const cand={a,hi,H,ci,vi,pri:kind==="p"&&H[vi].includes("매핑")?2:1};
    if(!best||cand.pri>best.pri)best=cand;
  }
  if(!best)throw new Error(kind==="p"?"매니저코드와 「매핑지사실적 실적」(또는 실적) 열을 찾지 못했습니다.":"매니저사번과 「목표」 열을 찾지 못했습니다.");
  return best;
}
async function chunked(table,rows,op){for(let i=0;i<rows.length;i+=500){const r=await (op==="upsert"?sb.from(table).upsert(rows.slice(i,i+500)):sb.from(table).insert(rows.slice(i,i+500)));if(r.error)throw r.error}}
$("#xf").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const c=cur();if(!c)return;
  try{
    toast("파일을 읽는 중…");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});const T=findTable(wb,upKind),{a,hi,H,ci,vi}=T;
    const rows=a.slice(hi+1).filter(r=>/^\d{5,}$/.test(String(r[ci]).trim()));
    if(!rows.length)throw new Error("매니저 코드가 들어 있는 줄을 찾지 못했습니다.");
    if(upKind==="p"){
      if(!DATA.length)throw new Error("이 시상에 목표가 아직 없습니다. 먼저 목표 올리기로 타겟 엑셀을 올려 주세요.");
      const m=new Map();rows.forEach(r=>{const v=num(r[vi]);if(v!=null){const k=String(r[ci]).trim();m.set(k,(m.get(k)||0)+v)}});
      const mine=DATA.filter(r=>m.has(r.c)),miss=DATA.length-mine.length,newSum=mine.reduce((s,r)=>s+m.get(r.c),0),oldSum=DATA.reduce((s,r)=>s+r.p,0),other=[...m.keys()].filter(k=>!DATA.some(r=>r.c===k)).length;
      if(!confirm(`「${c.name}」 진척을 올립니다.\n읽은 열: 「${H[vi]}」\n명단에 있는 매니저 ${mine.length}명 / 파일에 없어서 0원 처리 ${miss}명${other?`\n(이 시상 명단에 없는 코드 ${other}개는 제외)`:""}\n새 진척 합계 ${f(newSum)}원 ← 기존 ${f(oldSum)}원\n계속할까요?`))return;
      toast("저장 중…");
      const out=DATA.map(r=>({campaign:cid,code:r.c,perf:m.get(r.c)||0}));
      await chunked("spot_perf",out,"upsert");
      const r2=await sb.from("spot_campaigns").update({perf_at:new Date().toISOString(),perf_by:me,file_name:file.name}).eq("id",cid);if(r2.error)throw r2.error;
      toast("진척을 올렸습니다");
    }else{
      const ni=H.findIndex(x=>x==="매니저명"||x==="이름"),bi=H.findIndex(x=>x==="지점명"),hh=H.findIndex(x=>x==="지점장명"||x==="지점장"),gi=H.findIndex(x=>x==="직책");
      const pi=H.findIndex((x,j)=>j!==vi&&(x==="실적"||x.endsWith("실적")&&!x.includes("달성")));
      const seen=new Set(),list=[];rows.forEach(r=>{const k=String(r[ci]).trim();if(seen.has(k))return;seen.add(k);list.push({b:String(r[bi]||"").trim(),h:String(r[hh]||"").trim(),c:k,n:String(r[ni]||"").trim(),g:String(r[gi]||"").trim(),t:num(r[vi])||0,p:pi>=0?(num(r[pi])||0):0})});
      if(!confirm(`「${c.name}」 목표를 올립니다.\n읽은 열: 「${H[vi]}」${pi>=0?`\n함께 있는 「${H[pi]}」 열을 현재 진척으로 같이 넣습니다.`:""}\n매니저 ${list.length}명 · 목표 합계 ${f(list.reduce((s,r)=>s+r.t,0))}원\n${DATA.length?"(이 시상의 기존 목표"+(pi>=0?"·진척":"")+"는 이 파일 내용으로 바뀝니다)\n":""}계속할까요?`))return;
      toast("저장 중…");
      let r=await sb.from("spot_targets").delete().eq("campaign",cid);if(r.error)throw r.error;
      await chunked("spot_targets",list.map((x,i)=>({campaign:cid,code:x.c,branch:x.b,branch_head:x.h,manager:x.n,grade:x.g,target:x.t,ord:i})),"insert");
      if(pi>=0){r=await sb.from("spot_perf").delete().eq("campaign",cid);if(r.error)throw r.error;await chunked("spot_perf",list.map(x=>({campaign:cid,code:x.c,perf:x.p})),"insert");const r3=await sb.from("spot_campaigns").update({perf_at:new Date().toISOString(),perf_by:me,file_name:file.name}).eq("id",cid);if(r3.error)throw r3.error}
      toast("목표를 올렸습니다");
    }
    await loadData();render();
  }catch(err){alert("올리지 못했습니다.\n"+(err&&err.message?err.message:err))}
};

async function exportImg(mode){
  const el=$("#sheet");if(!window.html2canvas){toast("이미지 도구를 불러오지 못했습니다.");return}
  toast("이미지 만드는 중…");
  try{
    const w=Math.ceil(el.scrollWidth),h=Math.ceil(el.scrollHeight);
    const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",width:w,height:h,windowWidth:Math.max(w+80,1200),windowHeight:Math.max(document.documentElement.scrollHeight,h)+80,onclone:(d,c)=>{c.style.overflow="visible";c.style.maxWidth="none"}});
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    if(mode==="save"){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`스팟시상_${(cur()?.name||"").replace(/[\\/:*?"<>|]/g,"")}${sel.size?"_"+[...sel].map(bnum).sort((x,y)=>x-y).join("-")+"지점":""}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("이미지를 저장했습니다")}
    else{await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);toast("이미지를 복사했습니다. 붙여넣기(Ctrl+V) 하세요")}
  }catch(e){toast(mode==="copy"?"복사하지 못했습니다. 이미지 저장을 사용해 주세요.":"이미지를 만들지 못했습니다.")}
}
